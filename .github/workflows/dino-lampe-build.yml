name: Dino-Lampe Firmware Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Node.js einrichten (für Web-UI-Build)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: PlatformIO installieren
        run: pip install platformio

      - name: Firmware bauen (nur unsere eigene Umgebung)
        run: pio run -e nodemcuv2

      - name: Firmware als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: dino-lampe-firmware
          path: .pio/build/nodemcuv2/firmware.bin
          if-no-files-found: error
