[platformio]
default_envs = nodemcuv2

[env:nodemcuv2]
board = d1_mini_pro
build_flags = ${common.build_flags} ${esp8266.build_flags}
  -D WLED_RELEASE_NAME=\"DinoLampe\"
  
  ; === NETWORK & SMART HOME DEAKTIVIEREN ===
  -D WLED_DISABLE_ALEXA
  -D WLED_DISABLE_HUESYNC
  -D WLED_DISABLE_INFRARED
  -D WLED_DISABLE_LOXONE
  -D WLED_DISABLE_MQTT
  -D WLED_DISABLE_BYNIGHT
  -D WLED_DISABLE_ESPNOW

  ; === PROTOKOLLE & SCHNITTSTELLEN DEAKTIVIEREN ===
  -D WLED_DISABLE_HYPERION
  -D WLED_DISABLE_UDP
  -D WLED_DISABLE_E131
  -D WLED_DISABLE_ARTNET
  -D WLED_DISABLE_IMPROV

  ; === EFFEKTE & MATRIX (2D) DEAKTIVIEREN ===
  -D WLED_DISABLE_2D
  -D WLED_DISABLE_PARTICLESYSTEM2D

custom_usermods = Dino_Killswitch